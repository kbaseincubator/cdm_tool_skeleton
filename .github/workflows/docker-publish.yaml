# This is boilerplate for publishing a Docker image via Github Actions.

name: Docker

on:
  # On the skeleton repo itself the Dockerfile is a placeholder
  # (FROM replaceme/tool:version) so auto-builds will always fail. Only
  # workflow_dispatch is wired up here. When you copy this repo to wrap a
  # real tool, replace the placeholder FROM line in Dockerfile and uncomment
  # the push / pull_request / release triggers below.
  workflow_dispatch:
  # push:
  #   branches: [ "main", "master", "develop" ]
  #   # Publish semver tags as releases.
  #   tags:
  #     - 'v[0-9]+.[0-9]+.[0-9]+'
  #     - '[0-9]+.[0-9]+.[0-9]+'
  #     - '[0-9]+.[0-9]+.[0-9]+-*'
  # pull_request:
  #   branches: [ "main", "master", "develop" ]
  # release:
  #   types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
